<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India's Got Latent — Apple TV Cinema</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* ==========================================================================
           1. APPLE TV DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            --apple-accent: #0071e3;
            --apple-accent-glow: rgba(0, 113, 227, 0.45);
            --apple-bg: #050507;
            --apple-card-bg: rgba(255, 255, 255, 0.04);
            --apple-card-border: rgba(255, 255, 255, 0.08);
            --apple-glass-bg: rgba(20, 20, 25, 0.65);
            --apple-glass-border: rgba(255, 255, 255, 0.12);
            --apple-radius-lg: 24px;
            --apple-radius-md: 14px;
            --apple-radius-sm: 8px;
            --apple-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            --apple-ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--apple-font);
            background-color: var(--apple-bg);
            color: #f5f5f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* Ambient Screen Glow (Apple TV Cinema Effect) */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            width: 80%;
            height: 60%;
            background: radial-gradient(circle, rgba(0, 113, 227, 0.18) 0%, rgba(138, 43, 226, 0.08) 40%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            transition: opacity 1s ease;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1240px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        .tv-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
        }

        .tv-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #d2d2d7;
            backdrop-filter: blur(10px);
        }

        .tv-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background-color: #34c759;
            border-radius: 50%;
            box-shadow: 0 0 8px #34c759;
        }

        .tv-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==========================================================================
           2. PLAYER GLASS WRAPPER & LAYOUT
           ========================================================================== */
        .player-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            background: var(--apple-glass-bg);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid var(--apple-glass-border);
            border-radius: var(--apple-radius-lg);
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: transform 0.4s var(--apple-ease);
        }

        @media (min-width: 900px) {
            .player-wrapper {
                flex-direction: row;
            }
        }

        /* Video Stage */
        .video-stage {
            flex: 2.8;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        /* Smooth Hide for Video until metadata is ready (Fixes Flash/Glitch) */
        .video-stage video {
            opacity: 0;
            transition: opacity 0.6s var(--apple-ease);
        }

        .video-stage.is-ready video {
            opacity: 1;
        }

        /* Skeleton Screen while Video First Load */
        .video-skeleton {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #0d0d11 25%, #181820 50%, #0d0d11 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 2s infinite linear;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s var(--apple-ease);
        }

        .video-stage.is-ready .video-skeleton {
            opacity: 0;
        }

        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ==========================================================================
           3. APPLE TV-STYLE HUD OVERLAYS & PRELOADER
           ========================================================================== */
        
        /* Premium Loading Screen Overlay */
        .apple-loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 8, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--apple-ease);
        }

        .video-stage.is-buffering .apple-loader-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        /* Dynamic Ring Spinner */
        .apple-spinner-ring {
            width: 54px;
            height: 54px;
            position: relative;
            margin-bottom: 24px;
        }

        .apple-spinner-ring svg {
            width: 100%;
            height: 100%;
            animation: rotate-spinner 1.4s linear infinite;
        }

        .apple-spinner-ring circle {
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
        }

        .apple-spinner-ring .bg {
            stroke: rgba(255, 255, 255, 0.1);
        }

        .apple-spinner-ring .meter {
            stroke: url(#apple-grad);
            stroke-dasharray: 120;
            stroke-dashoffset: 40;
            animation: dash-spinner 1.4s ease-in-out infinite;
        }

        @keyframes rotate-spinner {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash-spinner {
            0% { stroke-dashoffset: 110; }
            50% { stroke-dashoffset: 30; }
            100% { stroke-dashoffset: 110; }
        }

        /* Apple TV Glossy Buffer Progress Track */
        .apple-progress-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 220px;
        }

        .apple-progress-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }

        .apple-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0071e3, #30b0ff);
            border-radius: 10px;
            transition: width 0.25s var(--apple-ease);
            box-shadow: 0 0 12px var(--apple-accent-glow);
        }

        .apple-progress-status {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        /* TV HUD Badges (Skip Forward / Rewind / Volume Popups) */
        .tv-hud-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 16px 28px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 35;
            transition: all 0.3s var(--apple-ease);
        }

        .tv-hud-badge.is-active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Quick Skip Buttons Overlay (On-Hover) */
        .apple-skip-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%) scale(0.9);
            z-index: 30;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            opacity: 0;
            transition: all 0.3s var(--apple-ease);
        }

        .video-stage:hover .apple-skip-btn {
            opacity: 0.85;
            transform: translateY(-50%) scale(1);
        }

        .apple-skip-btn:hover {
            opacity: 1 !important;
            transform: translateY(-50%) scale(1.12) !important;
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .apple-skip-btn:active {
            transform: translateY(-50%) scale(0.98) !important;
        }

        .skip-prev { left: 24px; }
        .skip-next { right: 24px; }

        /* ==========================================================================
           4. PLYR UI OVERRIDES (APPLE CINEMA STYLING)
           ========================================================================== */
        .plyr {
            --plyr-color-main: var(--apple-accent);
            --plyr-video-control-color: #ffffff;
            --plyr-video-control-color-hover: #ffffff;
            --plyr-control-radius: 8px;
            font-family: var(--apple-font);
            width: 100%;
            height: 100%;
            border-radius: 0;
        }

        .plyr__controls {
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.85) 100%) !important;
            padding: 20px 18px 14px 18px !important;
            gap: 12px;
        }

        /* Apple-style Progress Bar within Plyr */
        .plyr__progress__container {
            position: relative;
        }

        .plyr__progress input[type="range"] {
            cursor: pointer;
        }

        /* Hide Plyr's default loading spinner to avoid double spinners */
        .plyr--loading .plyr__video-wrapper::before {
            display: none !important;
        }

        /* ==========================================================================
           5. EPISODES PLAYLIST & FOCUS ENGINE (APPLE TV STYLE)
           ========================================================================== */
        .playlist-stage {
            flex: 1.1;
            background: rgba(10, 10, 14, 0.4);
            padding: 28px 22px;
            border-left: 1px solid var(--apple-glass-border);
            display: flex;
            flex-direction: column;
        }

        .playlist-title-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .playlist-heading {
            font-size: 0.85rem;
            font-weight: 700;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .episodes-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
            max-height: 480px;
            padding-right: 4px;
        }

        /* Scrollbar */
        .episodes-list::-webkit-scrollbar {
            width: 5px;
        }
        .episodes-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        /* Apple TV Card Focus Engine */
        .ep-card {
            position: relative;
            background: var(--apple-card-bg);
            border: 1px solid var(--apple-card-border);
            padding: 16px;
            border-radius: var(--apple-radius-md);
            cursor: pointer;
            transition: all 0.35s var(--apple-ease);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ep-card:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.15);
        }

        .ep-card.is-active {
            background: rgba(0, 113, 227, 0.15);
            border-color: var(--apple-accent);
            box-shadow: 0 10px 30px rgba(0, 113, 227, 0.25), 0 0 0 1px var(--apple-accent);
        }

        .ep-card.is-active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 20%;
            bottom: 20%;
            width: 4px;
            background: var(--apple-accent);
            border-radius: 0 4px 4px 0;
            box-shadow: 0 0 10px var(--apple-accent);
        }

        .ep-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .ep-title {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.35;
            color: #e5e5e7;
            transition: color 0.2s;
        }

        .ep-card.is-active .ep-title {
            color: #ffffff;
        }

        .ep-badge-4k {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            color: #000000;
            font-weight: 800;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        .server-pills {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .server-pill {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: var(--apple-radius-sm);
            background: rgba(255, 255, 255, 0.06);
            color: #a1a1a6;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s var(--apple-ease);
        }

        .server-pill:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .server-pill.is-active {
            background: var(--apple-accent);
            color: #ffffff;
            border-color: var(--apple-accent);
            box-shadow: 0 0 12px var(--apple-accent-glow);
        }
    </style>
</head>
<body>

    <!-- Ambient Cinema Glow -->
    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="main-container">
        
        <!-- TV Top Bar -->
        <header class="tv-header">
            <h1 class="tv-title">India’s Got Latent</h1>
            <span class="tv-badge">Apple Cinema Edition</span>
        </header>

        <!-- Main TV Player Card -->
        <main class="player-wrapper">
            
            <!-- Video Stage -->
            <div class="video-stage" id="video-stage">
                
                <!-- Skeleton Shimmer Loader (Prevents initial jump/glitch) -->
                <div class="video-skeleton"></div>

                <!-- Custom Skip Buttons (On Hover) -->
                <button class="apple-skip-btn skip-prev" onclick="handleSkip(-10)" title="Rewind 10 seconds">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                </button>
                <button class="apple-skip-btn skip-next" onclick="handleSkip(10)" title="Forward 10 seconds">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>

                <!-- TV HUD Toast Notification Badge -->
                <div class="tv-hud-badge" id="tv-hud">
                    <span id="hud-icon">⏩</span>

                <!-- Apple TV Dynamic Preloader & Buffer Track -->
                <div class="apple-loader-overlay">

                    </div>
                    <div class="apple-progress-box">
                        <div class="apple-progress-track">

                </div>

                <!-- HTML5 Video Element -->
                <video id="player" playsinline controls preload="metadata">
                    <source src="https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/INDIA's%20GOT%20LATENT%20S2%20Bonus%20EP1%20Ft.%20Raghav%20Juyal%2C%20Munawar%20Niharika%20NM%2C%20Rohan%20Joshi%202160p.mkv" type="video/webm" />

            <!-- Episodes Playlist -->
            <aside class="playlist-stage">

                <div class="episodes-list">
                    
                    <!-- Episode 3 (4K HD) -->
                    <div class="ep-card is-active" id="ep3" onclick="switchEpisode('ep3', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/INDIA\'s%20GOT%20LATENT%20S2%20Bonus%20EP1%20Ft.%20Raghav%20Juyal%2C%20Munawar%20Niharika%20NM%2C%20Rohan%20Joshi%202160p.mkv', 'video/webm')">
                        <div class="ep-header">
                            <div class="ep-title">S2 Bonus EP1 ft. Raghav Juyal, Munawar, Niharika NM</div>

                        </div>
                    </div>

                    <!-- Episode 1 (SD) -->
                    <div class="ep-card" id="ep1" onclick="switchEpisode('ep1', 'https://github.com/Akshat4739/data/raw/refs/heads/main/INDIA%E2%80%99S%20GOT%20LATENT%20S2%20Bonus%20EP1%20ft%20%20Raghav%20Juyal,%20Munawar,%20Niharika%20NM,%20Rohan%20Joshi%20MEMBERS%20ONLY%20216.mp4', 'video/mp4')">
                        <div class="ep-header">
                            <div class="ep-title">S2 Bonus EP1 (Standard HD)</div>

                    <!-- Episode 2 (BTS) -->
                    <div class="ep-card" id="ep2" onclick="switchEpisode('ep2', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/E03_Latent_BTS_ft_Raghu_Ram%2C_Tanmay_Bhat%2C_Vishal_Dadlani_MEMBERS.mkv', 'video/webm')">

                        <div class="server-pills">
                            <span class="server-pill is-active" onclick="event.stopPropagation(); switchEpisode('ep2', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/E03_Latent_BTS_ft_Raghu_Ram%2C_Tanmay_Bhat%2C_Vishal_Dadlani_MEMBERS.mkv', 'video/webm', this)">Server 1</span>
                            <span class="server-pill" onclick="event.stopPropagation(); switchEpisode('ep2', 'https://archive.org/download/e-03-latent/E03_Latent_BTS_ft_Raghu_Ram%2C_Tanmay_Bhat%2C_Vishal_Dadlani_MEMBERS.mkv', 'video/webm', this)">Server 2 (Archive)</span>

    <!-- Scripts -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        let player;
        let hudTimeout;
        let bufferCheckInterval;

        const stage = document.getElementById('video-stage');
        const bufferBar = document.getElementById('apple-buffer-bar');
        const bufferText = document.getElementById('apple-buffer-text');
        const hud = document.getElementById('tv-hud');
        const hudIcon = document.getElementById('hud-icon');
        const hudText = document.getElementById('hud-text');

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Initialize Plyr with optimized Apple Cinema controls
            player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 
                    'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'
                ],
                settings: ['speed'],
                keyboard: { focused: true, global: true },
                tooltips: { controls: true, seek: true }
            });

            // 2. Glitch-Free Readiness Handling
            player.on('ready', () => {
                // Preload checks & reveal smooth transition
                setTimeout(() => {
                    stage.classList.add('is-ready');
                }, 400);
            });

            // 3. Smooth Dynamic Buffer Calculation
            function updateBufferProgress() {
                const media = player.media;
                if (!media) return;

                if (media.buffered.length > 0 && media.duration > 0) {
                    const bufferedEnd = media.buffered.end(media.buffered.length - 1);
                    const duration = media.duration;
                    const percent = Math.min(Math.round((bufferedEnd / duration) * 100), 100);

                    bufferBar.style.width = percent + '%';
                    bufferText.innerText = percent + '%';

                    if (percent >= 98 || media.readyState >= 3) {
                        hideBufferingState();
                    }
                }
            }

            function showBufferingState() {
                stage.classList.add('is-buffering');
                clearInterval(bufferCheckInterval);
                bufferCheckInterval = setInterval(updateBufferProgress, 150);
            }

            function hideBufferingState() {
                bufferBar.style.width = '100%';
                bufferText.innerText = '100%';
                clearInterval(bufferCheckInterval);
                
                setTimeout(() => {
                    stage.classList.remove('is-buffering');
                }, 300);
            }

            // Bind player events to eliminate buffer stutter
            player.on('waiting', showBufferingState);
            player.on('seeking', showBufferingState);
            player.on('playing', hideBufferingState);
            player.on('canplay', hideBufferingState);
            player.on('progress', updateBufferProgress);

            // 4. Keyboard Shortcuts HUD Integration
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (e.key === 'ArrowRight') {
                    handleSkip(10);
                } else if (e.key === 'ArrowLeft') {
                    handleSkip(-10);
                }
            });
        });

        // 5. TV HUD Toast Trigger
        function triggerHUD(icon, text) {
            hudIcon.innerText = icon;
            hudText.innerText = text;
            hud.classList.add('is-active');

            clearTimeout(hudTimeout);
            hudTimeout = setTimeout(() => {
                hud.classList.remove('is-active');
            }, 900);
        }

        // 6. Smooth Skip Handler
        function handleSkip(seconds) {
            if (!player) return;
            player.forward(seconds);
            if (seconds > 0) {
                triggerHUD('⏩', `+${seconds}s`);
            } else {
                triggerHUD('⏪', `${seconds}s`);
            }
        }

        // 7. Episode & Server Switcher (Seamless transition without glitching)
        function switchEpisode(epId, src, type, pillElement = null) {
            // Update active episode card state
            document.querySelectorAll('.ep-card').forEach(el => el.classList.remove('is-active'));
            const targetCard = document.getElementById(epId);
            if (targetCard) targetCard.classList.add('is-active');

            // Update active server pill
            if (pillElement) {
                const parent = pillElement.closest('.server-pills');
                parent.querySelectorAll('.server-pill').forEach(el => el.classList.remove('is-active'));
                pillElement.classList.add('is-active');
            }

            // Smooth loader trigger
            stage.classList.remove('is-ready');
            stage.classList.add('is-buffering');
            bufferBar.style.width = '0%';
            bufferText.innerText = '0%';

            // Switch source safely
            player.source = {
                type: 'video',
                sources: [{ src: src, type: type }]
            };

            player.play().then(() => {
                stage.classList.add('is-ready');
            }).catch(() => {
                // Handles autoplay block on modern browsers gracefully
                stage.classList.add('is-ready');
            });
        }
    </script>
</body>
</html>
