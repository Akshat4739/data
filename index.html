<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India's Got Latent - Apple Cinema</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* =========================================
           APPLE TV / GLASSMORPHISM THEMING
        ========================================= */
        :root {
            --plyr-color-main: #0071e3; /* Apple Blue */
            --apple-bg: #0d0d0f;
            --apple-glass: rgba(30, 30, 35, 0.65);
            --apple-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: var(--apple-bg);
            color: #f5f5f7;
            margin: 0;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            background: linear-gradient(180deg, #ffffff, #a1a1a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Player Container */
        .player-wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1180px;
            background: var(--apple-glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--apple-border);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        @media (min-width: 850px) {
            .player-wrapper {
                flex-direction: row;
            }
        }

        .video-wrapper {
            flex: 2.6; 
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================================
           APPLE LOADING OVERLAY
        ========================================= */
        .premium-loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .is-buffering .premium-loader-overlay {
            opacity: 1;
        }

        /* Minimal Ring Spinner */
        .apple-spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 20px;
        }

        /* Track Container */
        .apple-progress-container {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .apple-progress-bar {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 10px;
            transition: width 0.2s ease;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
        }

        .apple-progress-text {
            margin-top: 10px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.5px;
        }

        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }

        .plyr--loading .plyr__video-wrapper::before {
            display: none !important;
        }

        /* Custom Skip Controls Overlay */
        .apple-skip-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 30;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .video-wrapper:hover .apple-skip-btn {
            opacity: 0.8;
        }

        .apple-skip-btn:hover {
            opacity: 1 !important;
            transform: translateY(-50%) scale(1.1);
            background: rgba(255, 255, 255, 0.25);
        }

        .skip-left { left: 20px; }
        .skip-right { right: 20px; }

        /* =========================================
           PLAYLIST UI
        ========================================= */
        .playlist-container {
            flex: 1; 
            background: rgba(18, 18, 22, 0.5);
            padding: 24px;
            border-left: 1px solid var(--apple-border);
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            font-size: 0.85rem;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #86868b;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .playlist-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: 480px;
        }

        .playlist-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            transition: all 0.25s ease;
        }

        .playlist-item.active {
            border-color: rgba(0, 113, 227, 0.5);
            background: rgba(0, 113, 227, 0.12);
        }

        .video-title {
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.35;
            cursor: pointer;
            color: #d2d2d7;
            transition: color 0.2s;
        }

        .playlist-item.active .video-title {
            color: #ffffff;
            font-weight: 600;
        }

        .server-list {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .server-badge {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            color: #a1a1a6;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .server-badge.active {
            background: #0071e3;
            color: #fff;
        }
    </style>
</head>
<body>

    <h2>India’s Got Latent</h2>

    <div class="player-wrapper">
        
        <!-- Video Wrapper -->
        <div class="video-wrapper" id="video-wrapper">
            
            <!-- Apple Skip Buttons -->
            <button class="apple-skip-btn skip-left" onclick="skipTime(-10)" title="Rewind 10s">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
            </button>
            <button class="apple-skip-btn skip-right" onclick="skipTime(10)" title="Forward 10s">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>
            </button>

            <!-- Loading Overlay -->
            <div class="premium-loader-overlay">
                <div class="apple-spinner"></div>
                <div class="apple-progress-container">
                    <div class="apple-progress-bar" id="premium-progress-bar"></div>
                </div>
                <div class="apple-progress-text" id="premium-progress-text">0%</div>
            </div>
            
            <!-- Video Container -->
            <video id="player" playsinline controls>
                <source src="https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/INDIA's%20GOT%20LATENT%20S2%20Bonus%20EP1%20Ft.%20Raghav%20Juyal%2C%20Munawar%20Niharika%20NM%2C%20Rohan%20Joshi%202160p.mkv" type="video/webm" />
            </video>
        </div>

        <!-- Playlist Section -->
        <div class="playlist-container">
            <h3 class="playlist-header">Episodes</h3>
            
            <div class="playlist-items">
                <div class="playlist-item active" id="ep3">
                    <div class="video-title" onclick="playEpisode('ep3', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/INDIA\'s%20GOT%20LATENT%20S2%20Bonus%20EP1%20Ft.%20Raghav%20Juyal%2C%20Munawar%20Niharika%20NM%2C%20Rohan%20Joshi%202160p.mkv', 'video/webm')">
                        S2 Bonus EP1 (4K Ultra HD)
                    </div>
                    <div class="server-list">
                        <span class="server-badge active" onclick="playEpisode('ep3', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/INDIA\'s%20GOT%20LATENT%20S2%20Bonus%20EP1%20Ft.%20Raghav%20Juyal%2C%20Munawar%20Niharika%20NM%2C%20Rohan%20Joshi%202160p.mkv', 'video/webm', this)">Server 1 (GitHub)</span>
                    </div>
                </div>

                <div class="playlist-item" id="ep1">
                    <div class="video-title" onclick="playEpisode('ep1', 'https://github.com/Akshat4739/data/raw/refs/heads/main/INDIA%E2%80%99S%20GOT%20LATENT%20S2%20Bonus%20EP1%20ft%20%20Raghav%20Juyal,%20Munawar,%20Niharika%20NM,%20Rohan%20Joshi%20MEMBERS%20ONLY%20216.mp4', 'video/mp4')">
                        S2 Bonus EP1 (Standard HD)
                    </div>
                    <div class="server-list">
                        <span class="server-badge active" onclick="playEpisode('ep1', 'https://github.com/Akshat4739/data/raw/refs/heads/main/INDIA%E2%80%99S%20GOT%20LATENT%20S2%20Bonus%20EP1%20ft%20%20Raghav%20Juyal,%20Munawar,%20Niharika%20NM,%20Rohan%20Joshi%20MEMBERS%20ONLY%20216.mp4', 'video/mp4', this)">Server 1 (GitHub)</span>
                    </div>
                </div>

                <div class="playlist-item" id="ep2">
                    <div class="video-title" onclick="playEpisode('ep2', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/E03_Latent_BTS_ft_Raghu_Ram%2C_Tanmay_Bhat%2C_Vishal_Dadlani_MEMBERS.mkv', 'video/webm')">
                        E03 Latent BTS
                    </div>
                    <div class="server-list">
                        <span class="server-badge active" onclick="playEpisode('ep2', 'https://media.githubusercontent.com/media/Akshat4739/data/refs/heads/main/E03_Latent_BTS_ft_Raghu_Ram%2C_Tanmay_Bhat%2C_Vishal_Dadlani_MEMBERS.mkv', 'video/webm', this)">Server 1</span>
                        <span class="server-badge" onclick="playEpisode('ep2', 'https://archive.org/download/e-03-latent/E03_Latent_BTS_ft_Raghu_Ram%2C_Tanmay_Bhat%2C_Vishal_Dadlani_MEMBERS.mkv', 'video/webm', this)">Server 2</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        let player;
        let bufferInterval;

        document.addEventListener('DOMContentLoaded', () => {
            player = new Plyr('#player', {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 
                    'duration', 'mute', 'volume', 'settings', 'pip', 'fullscreen'
                ],
                settings: ['speed', 'loop']
            });

            const videoWrapper = document.getElementById('video-wrapper');
            const progressBar = document.getElementById('premium-progress-bar');
            const progressText = document.getElementById('premium-progress-text');

            function updateBufferUI(percent) {
                const p = Math.min(Math.max(Math.floor(percent), 0), 100);
                progressBar.style.width = p + '%';
                progressText.innerText = p + '%';
            }

            // Real Buffer-Tracking Engine
            function trackActualBuffering() {
                const media = player.media;
                if (!media) return;

                if (media.buffered.length > 0 && media.duration > 0) {
                    // Get highest buffered time chunk
                    const bufferedEnd = media.buffered.end(media.buffered.length - 1);
                    const duration = media.duration;
                    const percent = (bufferedEnd / duration) * 100;

                    updateBufferUI(percent);

                    if (percent >= 99 || media.readyState >= 3) {
                        finishBuffering();
                    }
                }
            }

            function startBuffering() {
                videoWrapper.classList.add('is-buffering');
                clearInterval(bufferInterval);
                bufferInterval = setInterval(trackActualBuffering, 200);
            }

            function finishBuffering() {
                updateBufferUI(100);
                clearInterval(bufferInterval);
                setTimeout(() => {
                    videoWrapper.classList.remove('is-buffering');
                }, 300);
            }

            player.on('waiting', startBuffering);
            player.on('playing', finishBuffering);
            player.on('canplay', finishBuffering);
            player.on('progress', trackActualBuffering);
        });

        // Skip Handler (Rewind / Fast Forward)
        function skipTime(seconds) {
            if (player) {
                player.forward(seconds);
            }
        }

        // Episode Switcher
        function playEpisode(epId, src, type, badgeElement = null) {
            document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
            document.getElementById(epId).classList.add('active');

            if (badgeElement) {
                const parent = badgeElement.closest('.server-list');
                parent.querySelectorAll('.server-badge').forEach(el => el.classList.remove('active'));
                badgeElement.classList.add('active');
            }

            const videoWrapper = document.getElementById('video-wrapper');
            videoWrapper.classList.add('is-buffering');

            player.source = {
                type: 'video',
                sources: [{ src: src, type: type }]
            };

            player.play().catch(() => {});
        }
    </script>
</body>
</html>
